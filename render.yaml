# Render Blueprint: creates the API and the web version on the free plan.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: westminster-api
    runtime: node
    plan: free
    # Close to the Neon database (create it in AWS US East 2 / Ohio).
    region: ohio
    rootDir: backend
    # --include=dev: the build needs the Nest CLI and TypeScript even with
    # NODE_ENV=production.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Applies pending database migrations, then starts the API.
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: DATABASE_URL
        sync: false
      - key: GROUP_INVITE_CODE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Web version allowed to call the API (address of westminster-web).
      - key: CORS_ORIGINS
        value: https://westminster-web.onrender.com

  # Web version of the app (same screens as the APK, except photo import).
  # Static sites are free and do not use the API's monthly hours.
  - type: web
    name: westminster-web
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export -p web
    staticPublishPath: dist
    # Rebuild only when the app changes.
    buildFilter:
      paths:
        - mobile/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_API_URL
        value: https://westminster-api.onrender.com
    # Every path opens the app; the router shows the right screen.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
